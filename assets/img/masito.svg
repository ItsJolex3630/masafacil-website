<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 560" role="img" aria-label="Masito, el asistente de Masa Fácil">
  <defs>
    <radialGradient id="bodyG" cx="36%" cy="26%" r="86%">
      <stop offset="0%" stop-color="#FBD26C"/>
      <stop offset="52%" stop-color="#F3B242"/>
      <stop offset="100%" stop-color="#E29A32"/>
    </radialGradient>
    <radialGradient id="cupG" cx="42%" cy="34%" r="78%">
